name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # Шаг 1: Получить код из репозитория
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Шаг 2: Простая проверка - выводим список файлов
    - name: List files
      run: ls -la
    
    # Шаг 3: Проверим, что HTML файл существует
    - name: Check HTML file
      run: |
        if [ -f "index.html" ]; then
          echo "✅ index.html найден!"
        else
          echo "❌ index.html не найден!"
          exit 1
        fi
    
    # Шаг 4: Можно проверить валидность HTML (опционально)
    - name: Validate HTML
      run: echo "Здесь можно добавить валидацию HTML"
